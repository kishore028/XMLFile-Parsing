<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Task</title>
</head>
<body>
<h2 th:text="${todo.id} != null ? 'Edit Task' : 'Add Task'"></h2>
<form action="/save" method="post" th:object="${todo}">
    <input type="hidden" th:field="*{id}">
    <label>Task:</label>
    <input type="text" th:field="*{task}" required><br>
    <label>Completed:</label>
    <input type="checkbox" th:field="*{completed}"><br><br>
    <button type="submit">Save</button>
</form>
</body>
</html>
